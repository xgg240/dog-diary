name: Build Android APK

on:
  push:
    branches: [ main, dog-diary ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Hello
        run: echo "=== Build starting on $(uname) ===" && date

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dog-diary-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      # ============================================
      # Release APK 拆 ABI (体积骤减: 162MB → ~30MB/arm64)
      # 2026-06-07 父要求: iOS 11M, Android debug 162MB 太大
      # ============================================
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64-v8a release APK (主流手机)
        uses: actions/upload-artifact@v4
        with:
          name: dog-diary-release-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a release APK (老手机)
        uses: actions/upload-artifact@v4
        with:
          name: dog-diary-release-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64 release APK (模拟器)
        uses: actions/upload-artifact@v4
        with:
          name: dog-diary-release-x64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Show release APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk 2>&1
